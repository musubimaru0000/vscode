<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI会話アプリ</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1e222b;
    --border: #2a2f3a;
    --text: #e6e8ec;
    --muted: #9aa2b1;
    --accent-a: #6c8cff;
    --accent-b: #ff8c69;
    --danger: #ff5c5c;
    --ok: #4ade80;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  header {
    padding: 20px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  header h1 {
    font-size: 18px;
    margin: 0;
    font-weight: 600;
  }
  header p {
    margin: 4px 0 0;
    font-size: 12px;
    color: var(--muted);
  }
  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .agents {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  @media (max-width: 720px) {
    .agents { grid-template-columns: 1fr; }
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
  }
  .card h2 {
    font-size: 14px;
    margin: 0 0 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    display: inline-block;
  }
  .dot-a { background: var(--accent-a); }
  .dot-b { background: var(--accent-b); }
  label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin: 10px 0 4px;
  }
  label:first-of-type { margin-top: 0; }
  input[type="text"], input[type="password"], input[type="number"], select, textarea {
    width: 100%;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 8px 10px;
    font-size: 13px;
    font-family: inherit;
  }
  textarea {
    resize: vertical;
    min-height: 64px;
  }
  .key-row {
    display: flex;
    gap: 6px;
    align-items: center;
  }
  .key-row input { flex: 1; }
  .key-row button {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 8px;
    padding: 8px 10px;
    cursor: pointer;
    font-size: 12px;
    white-space: nowrap;
  }
  .save-key {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 6px;
    font-size: 11px;
    color: var(--muted);
  }
  .save-key input { width: auto; }

  .controls {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .controls-row {
    display: grid;
    grid-template-columns: 2fr 1fr 1fr 1fr;
    gap: 12px;
    align-items: end;
  }
  @media (max-width: 720px) {
    .controls-row { grid-template-columns: 1fr; }
  }
  .buttons {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  button.primary {
    background: linear-gradient(135deg, var(--accent-a), #4a63d6);
    border: none;
    color: #fff;
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button.secondary {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
  }
  button:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }
  .status {
    font-size: 12px;
    color: var(--muted);
    min-height: 16px;
  }
  .status.error { color: var(--danger); }
  .status.ok { color: var(--ok); }

  .chat {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    min-height: 300px;
    max-height: 60vh;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .msg {
    max-width: 78%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg .name {
    font-size: 11px;
    font-weight: 700;
    margin-bottom: 4px;
    opacity: 0.8;
  }
  .msg.from-a {
    align-self: flex-start;
    background: rgba(108, 140, 255, 0.14);
    border: 1px solid rgba(108, 140, 255, 0.35);
  }
  .msg.from-a .name { color: var(--accent-a); }
  .msg.from-b {
    align-self: flex-end;
    background: rgba(255, 140, 105, 0.14);
    border: 1px solid rgba(255, 140, 105, 0.35);
  }
  .msg.from-b .name { color: var(--accent-b); text-align: right; }
  .msg.from-user {
    align-self: center;
    max-width: 88%;
    background: rgba(74, 222, 128, 0.14);
    border: 1px solid rgba(74, 222, 128, 0.4);
  }
  .msg.from-user .name { color: var(--ok); text-align: center; }
  .msg.system {
    align-self: center;
    background: transparent;
    border: 1px dashed var(--border);
    color: var(--muted);
    font-size: 12px;
    max-width: 90%;
  }
  .empty-hint {
    color: var(--muted);
    font-size: 13px;
    text-align: center;
    margin: auto;
  }
  .footer-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
  }
  .footer-actions button {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
  }

  .user-input-row {
    display: flex;
    gap: 10px;
  }
  .user-input-row input {
    flex: 1;
  }
  .user-input-row button {
    background: linear-gradient(135deg, var(--ok), #2fae63);
    border: none;
    color: #06210f;
    padding: 0 20px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
</style>
</head>
<body>

<header>
  <div>
    <h1>AI会話アプリ</h1>
    <p>2体のAIエージェントに、あなたが設定したペルソナで会話させます。APIキーはこの端末内のみで使われ、サーバーには送信されません。</p>
  </div>
</header>

<main>
  <section class="agents">
    <div class="card" id="card-a">
      <h2><span class="dot dot-a"></span> エージェントA</h2>

      <label>表示名</label>
      <input type="text" id="a-name" value="楽観主義者">

      <label>プロバイダ</label>
      <select id="a-provider">
        <option value="anthropic">Anthropic (Claude)</option>
        <option value="openai">OpenAI</option>
        <option value="gemini">Google (Gemini)</option>
      </select>

      <label>モデル名</label>
      <input type="text" id="a-model" placeholder="例: claude-sonnet-5" value="claude-sonnet-5">

      <label>APIキー</label>
      <div class="key-row">
        <input type="password" id="a-key" placeholder="sk-... / AIza... など">
        <button type="button" data-toggle="a-key">表示</button>
      </div>
      <div class="save-key">
        <input type="checkbox" id="a-key-save">
        <label style="margin:0;" for="a-key-save">このブラウザに保存する（共有端末では非推奨）</label>
      </div>

      <label>ペルソナ / システムプロンプト</label>
      <textarea id="a-system">あなたは楽観的でユーモアのある議論相手です。相手の意見を尊重しつつ、前向きな視点を提示してください。返答は3〜4文程度で簡潔にしてください。</textarea>
    </div>

    <div class="card" id="card-b">
      <h2><span class="dot dot-b"></span> エージェントB</h2>

      <label>表示名</label>
      <input type="text" id="b-name" value="懐疑主義者">

      <label>プロバイダ</label>
      <select id="b-provider">
        <option value="anthropic">Anthropic (Claude)</option>
        <option value="openai" selected>OpenAI</option>
        <option value="gemini">Google (Gemini)</option>
      </select>

      <label>モデル名</label>
      <input type="text" id="b-model" placeholder="例: gpt-4o" value="gpt-4o">

      <label>APIキー</label>
      <div class="key-row">
        <input type="password" id="b-key" placeholder="sk-... / AIza... など">
        <button type="button" data-toggle="b-key">表示</button>
      </div>
      <div class="save-key">
        <input type="checkbox" id="b-key-save">
        <label style="margin:0;" for="b-key-save">このブラウザに保存する（共有端末では非推奨）</label>
      </div>

      <label>ペルソナ / システムプロンプト</label>
      <textarea id="b-system">あなたは論理的で懐疑的な議論相手です。相手の主張の弱点や見落としを丁寧に指摘してください。返答は3〜4文程度で簡潔にしてください。</textarea>
    </div>
  </section>

  <section class="controls">
    <div>
      <label>あなたの表示名（会話に参加する際に使われます）</label>
      <input type="text" id="user-name" value="あなた" style="max-width:240px;">
    </div>
    <div>
      <label>お題 / 最初の話しかけ内容</label>
      <textarea id="topic" style="min-height:48px;">リモートワークは今後も主流であり続けるべきか？</textarea>
    </div>
    <div class="controls-row">
      <div>
        <label>最初に話すエージェント</label>
        <select id="starter">
          <option value="a">エージェントA</option>
          <option value="b">エージェントB</option>
        </select>
      </div>
      <div>
        <label>最大ターン数（合計発言数）</label>
        <input type="number" id="max-turns" value="10" min="1" max="60">
      </div>
      <div>
        <label>ターン間の待機（秒）</label>
        <input type="number" id="delay" value="1" min="0" max="30">
      </div>
      <div>
        <label>最大トークン数（応答ごと）</label>
        <input type="number" id="max-tokens" value="400" min="50" max="4096">
      </div>
    </div>
    <div class="buttons">
      <button class="primary" id="start-btn">会話を開始</button>
      <button class="secondary" id="stop-btn" disabled>停止</button>
      <button class="secondary" id="reset-btn">リセット</button>
    </div>
    <div class="status" id="status"></div>
  </section>

  <section class="chat" id="chat">
    <div class="empty-hint" id="empty-hint">まだ会話がありません。設定を入力して「会話を開始」を押してください。</div>
  </section>

  <div class="user-input-row">
    <input type="text" id="user-message" placeholder="会話に割り込んで発言する… (Enterで送信、実行中でも送れます)">
    <button id="send-btn">送信</button>
  </div>

  <div class="footer-actions">
    <button id="copy-btn">会話をテキストとしてコピー</button>
  </div>
</main>

<script>
(function () {
  const $ = (id) => document.getElementById(id);

  const els = {
    a: {
      name: $('a-name'), provider: $('a-provider'), model: $('a-model'),
      key: $('a-key'), keySave: $('a-key-save'), system: $('a-system'),
    },
    b: {
      name: $('b-name'), provider: $('b-provider'), model: $('b-model'),
      key: $('b-key'), keySave: $('b-key-save'), system: $('b-system'),
    },
    userName: $('user-name'),
    userMessage: $('user-message'),
    sendBtn: $('send-btn'),
    topic: $('topic'),
    starter: $('starter'),
    maxTurns: $('max-turns'),
    delay: $('delay'),
    maxTokens: $('max-tokens'),
    startBtn: $('start-btn'),
    stopBtn: $('stop-btn'),
    resetBtn: $('reset-btn'),
    status: $('status'),
    chat: $('chat'),
    emptyHint: $('empty-hint'),
    copyBtn: $('copy-btn'),
  };

  const STORAGE_KEY = 'ai-conversation-app:settings:v1';

  // --- persistence (non-sensitive fields always; API keys only if opted in) ---
  function loadSettings() {
    let saved = {};
    try {
      saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    } catch (e) { saved = {}; }

    for (const side of ['a', 'b']) {
      const s = saved[side];
      if (!s) continue;
      if (s.name) els[side].name.value = s.name;
      if (s.provider) els[side].provider.value = s.provider;
      if (s.model) els[side].model.value = s.model;
      if (s.system) els[side].system.value = s.system;
      if (s.keySave) {
        els[side].keySave.checked = true;
        if (s.key) els[side].key.value = s.key;
      }
    }
    if (saved.userName) els.userName.value = saved.userName;
    if (saved.topic) els.topic.value = saved.topic;
    if (saved.starter) els.starter.value = saved.starter;
    if (saved.maxTurns) els.maxTurns.value = saved.maxTurns;
    if (saved.delay !== undefined) els.delay.value = saved.delay;
    if (saved.maxTokens) els.maxTokens.value = saved.maxTokens;
  }

  function saveSettings() {
    const data = { userName: els.userName.value, topic: els.topic.value, starter: els.starter.value,
      maxTurns: els.maxTurns.value, delay: els.delay.value, maxTokens: els.maxTokens.value };
    for (const side of ['a', 'b']) {
      const keySave = els[side].keySave.checked;
      data[side] = {
        name: els[side].name.value,
        provider: els[side].provider.value,
        model: els[side].model.value,
        system: els[side].system.value,
        keySave,
        key: keySave ? els[side].key.value : '',
      };
    }
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }

  loadSettings();

  document.querySelectorAll('[data-toggle]').forEach((btn) => {
    btn.addEventListener('click', () => {
      const input = document.getElementById(btn.dataset.toggle);
      const show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      btn.textContent = show ? '隠す' : '表示';
    });
  });

  // --- provider adapters ---
  // Each adapter takes { apiKey, model, system, history, maxTokens, signal }
  // `history` is an array of { role: 'me' | 'other', text }, from the speaker's own point of view.
  // Returns the assistant's reply text.

  async function callAnthropic({ apiKey, model, system, history, maxTokens, signal }) {
    const messages = history.map(m => ({
      role: m.role === 'me' ? 'assistant' : 'user',
      content: m.text,
    }));
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      signal,
      headers: {
        'content-type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true',
      },
      body: JSON.stringify({ model, system, max_tokens: maxTokens, messages }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data?.error?.message || `Anthropic API error (${res.status})`);
    const text = (data.content || []).map(c => c.text || '').join('').trim();
    if (!text) throw new Error('Anthropicから空の応答が返されました');
    return text;
  }

  async function callOpenAI({ apiKey, model, system, history, maxTokens, signal }) {
    const messages = [
      { role: 'system', content: system },
      ...history.map(m => ({ role: m.role === 'me' ? 'assistant' : 'user', content: m.text })),
    ];
    const res = await fetch('https://api.openai.com/v1/chat/completions', {
      method: 'POST',
      signal,
      headers: {
        'content-type': 'application/json',
        'authorization': `Bearer ${apiKey}`,
      },
      body: JSON.stringify({ model, messages, max_tokens: maxTokens }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data?.error?.message || `OpenAI API error (${res.status})`);
    const text = data?.choices?.[0]?.message?.content?.trim();
    if (!text) throw new Error('OpenAIから空の応答が返されました');
    return text;
  }

  function normalizeGeminiModel(raw) {
    let m = raw.trim();
    // Full URL pasted (e.g. from a curl example) -> keep only the part after "/models/".
    const marker = '/models/';
    const idx = m.lastIndexOf(marker);
    if (idx !== -1) m = m.slice(idx + marker.length);
    m = m.replace(/^models\//, '');       // "models/gemini-2.5-flash" -> "gemini-2.5-flash"
    m = m.replace(/:generateContent.*$/, ''); // trailing ":generateContent" from a copied endpoint
    m = m.replace(/\?.*$/, '');           // trailing "?key=..." from a copied endpoint
    m = m.replace(/[‐-―−]/g, '-'); // smart/en/em dashes -> plain hyphen
    m = m.trim().toLowerCase();
    // Google AI Studio's display name (e.g. "Gemini 2.5 Flash-Lite") rather than
    // the API model ID ("gemini-2.5-flash-lite") -> turn spaces into hyphens too.
    m = m.replace(/\s+/g, '-').replace(/-+/g, '-');
    return m;
  }

  // Gemini now uses the Interactions API (https://ai.google.dev/gemini-api/docs/interactions-overview),
  // which Google recommends over generateContent for all new development. Unlike
  // generateContent, it manages conversation history server-side: each agent's
  // thread is continued via previous_interaction_id rather than by resending the
  // full message list every turn, so per-side state is tracked in geminiState.
  const GEMINI_INTERACTIONS_URL = 'https://generativelanguage.googleapis.com/v1beta2/interactions';
  const geminiState = {}; // { a: { lastInteractionId, deliveredIndex }, b: {...} }

  function getGeminiState(side) {
    if (!geminiState[side]) geminiState[side] = { lastInteractionId: undefined, deliveredIndex: 0 };
    return geminiState[side];
  }

  function resetGeminiState() {
    delete geminiState.a;
    delete geminiState.b;
  }

  function extractInteractionText(data) {
    return (data.steps || [])
      .filter(s => s.type === 'model_output')
      .flatMap(s => (s.content || []).filter(c => c.type === 'text').map(c => c.text || ''))
      .join('')
      .trim();
  }

  async function callGemini({ apiKey, model, system, side, signal }) {
    const modelId = normalizeGeminiModel(model);
    const state = getGeminiState(side);

    // Snapshot now (not after the await) so a mid-flight human/AI message isn't
    // silently skipped, and only commit past it once the call actually succeeds.
    const deliveredUpTo = conversation.length;
    const newEntries = conversation.slice(state.deliveredIndex, deliveredUpTo).filter(m => m.side !== side);
    let inputItems = newEntries.map(m => ({ type: 'text', text: `${getDisplayName(m.side)}: ${m.text}` }));
    if (inputItems.length === 0) {
      inputItems = [{ type: 'text', text: els.topic.value.trim() }];
    }
    if (!state.lastInteractionId && system) {
      inputItems = [{ type: 'text', text: `[System instructions for you]\n${system}` }, ...inputItems];
    }

    const res = await fetch(GEMINI_INTERACTIONS_URL, {
      method: 'POST',
      signal,
      headers: {
        'content-type': 'application/json',
        'x-goog-api-key': apiKey,
      },
      body: JSON.stringify({
        model: modelId,
        input: inputItems,
        previous_interaction_id: state.lastInteractionId,
      }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data?.error?.message || `Gemini API error (${res.status})`);

    const text = extractInteractionText(data);
    if (!text) throw new Error('Geminiから空の応答が返されました（安全フィルタでブロックされた可能性があります）');

    state.lastInteractionId = data.id;
    state.deliveredIndex = deliveredUpTo;
    return text;
  }

  const ADAPTERS = { anthropic: callAnthropic, openai: callOpenAI, gemini: callGemini };

  // --- conversation engine ---
  let running = false;
  let abortController = null;
  let conversation = []; // { side: 'a'|'b', text }

  function setStatus(text, type) {
    els.status.textContent = text || '';
    els.status.className = 'status' + (type ? ' ' + type : '');
  }

  function getDisplayName(side) {
    if (side === 'user') return els.userName.value.trim() || 'あなた';
    return els[side].name.value || (side === 'a' ? 'エージェントA' : 'エージェントB');
  }

  function renderMessage(side, text) {
    els.emptyHint.style.display = 'none';
    const div = document.createElement('div');
    div.className = 'msg from-' + side;
    const nameEl = document.createElement('div');
    nameEl.className = 'name';
    nameEl.textContent = getDisplayName(side);
    const bodyEl = document.createElement('div');
    bodyEl.textContent = text;
    div.appendChild(nameEl);
    div.appendChild(bodyEl);
    els.chat.appendChild(div);
    els.chat.scrollTop = els.chat.scrollHeight;
  }

  function renderSystemNote(text) {
    els.emptyHint.style.display = 'none';
    const div = document.createElement('div');
    div.className = 'msg system';
    div.textContent = text;
    els.chat.appendChild(div);
    els.chat.scrollTop = els.chat.scrollHeight;
  }

  const otherSideOf = (s) => (s === 'a' ? 'b' : 'a');

  function nextSpeakerSide() {
    // Whoever spoke last (ignoring the human) goes second-to-last; the other AI speaks next.
    for (let i = conversation.length - 1; i >= 0; i--) {
      const s = conversation[i].side;
      if (s === 'a' || s === 'b') return otherSideOf(s);
    }
    return els.starter.value === 'b' ? 'b' : 'a';
  }

  function buildHistoryFor(side) {
    // Convert the shared conversation log into this speaker's own-vs-other framing.
    // 'other' entries (the opposing AI or the human) are name-prefixed so the
    // distinction isn't lost when they get merged below.
    const raw = conversation.map(m => {
      const role = m.side === side ? 'me' : 'other';
      const text = role === 'other' ? `${getDisplayName(m.side)}: ${m.text}` : m.text;
      return { role, text };
    });

    // Providers like Anthropic/Gemini require strictly alternating roles, but a
    // human aside can produce two consecutive 'other' turns (or two consecutive
    // 'me' turns after a resumed run) — merge consecutive same-role entries.
    const merged = [];
    for (const item of raw) {
      const last = merged[merged.length - 1];
      if (last && last.role === item.role) {
        last.text += '\n\n' + item.text;
      } else {
        merged.push({ ...item });
      }
    }
    return merged;
  }

  function sleep(ms, signal) {
    return new Promise((resolve, reject) => {
      const t = setTimeout(resolve, ms);
      if (signal) {
        signal.addEventListener('abort', () => {
          clearTimeout(t);
          reject(new DOMException('Aborted', 'AbortError'));
        }, { once: true });
      }
    });
  }

  function validateConfig() {
    for (const side of ['a', 'b']) {
      if (!els[side].key.value.trim()) {
        return `エージェント${side.toUpperCase()}のAPIキーを入力してください。`;
      }
      if (!els[side].model.value.trim()) {
        return `エージェント${side.toUpperCase()}のモデル名を入力してください。`;
      }
    }
    if (!els.topic.value.trim()) {
      return 'お題を入力してください。';
    }
    return null;
  }

  async function runConversation() {
    const err = validateConfig();
    if (err) { setStatus(err, 'error'); return; }

    saveSettings();

    running = true;
    abortController = new AbortController();
    els.startBtn.disabled = true;
    els.stopBtn.disabled = false;
    setStatus('会話を実行中…');

    const maxTurns = Math.max(1, parseInt(els.maxTurns.value, 10) || 10);
    const maxTokens = Math.max(50, parseInt(els.maxTokens.value, 10) || 400);
    const delayMs = Math.max(0, parseInt(els.delay.value, 10) || 0) * 1000;
    let currentSide = nextSpeakerSide();

    try {
      for (let turn = 0; turn < maxTurns; turn++) {
        if (!running) break;

        const cfg = els[currentSide];
        const adapter = ADAPTERS[cfg.provider.value];
        const history = buildHistoryFor(currentSide);

        // On the very first turn, seed with the topic as an incoming message.
        if (history.length === 0) {
          history.push({ role: 'other', text: els.topic.value.trim() });
        }

        const reply = await adapter({
          apiKey: cfg.key.value.trim(),
          model: cfg.model.value.trim(),
          system: cfg.system.value.trim(),
          history,
          side: currentSide,
          maxTokens,
          signal: abortController.signal,
        });

        if (!running) break;

        conversation.push({ side: currentSide, text: reply });
        renderMessage(currentSide, reply);

        currentSide = otherSideOf(currentSide);

        if (turn < maxTurns - 1 && delayMs > 0) {
          await sleep(delayMs, abortController.signal);
        }
      }
      if (running) setStatus('会話が終了しました（最大ターン数に到達）。', 'ok');
    } catch (e) {
      if (e.name === 'AbortError') {
        setStatus('停止しました。', '');
      } else {
        setStatus('エラー: ' + e.message, 'error');
        renderSystemNote('エラーが発生したため会話を停止しました: ' + e.message);
      }
    } finally {
      running = false;
      abortController = null;
      els.startBtn.disabled = false;
      els.stopBtn.disabled = true;
    }
  }

  function sendUserMessage() {
    const text = els.userMessage.value.trim();
    if (!text) return;
    conversation.push({ side: 'user', text });
    renderMessage('user', text);
    els.userMessage.value = '';
    els.userMessage.focus();
  }

  els.sendBtn.addEventListener('click', sendUserMessage);
  els.userMessage.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.isComposing) {
      e.preventDefault();
      sendUserMessage();
    }
  });

  els.startBtn.addEventListener('click', runConversation);

  els.stopBtn.addEventListener('click', () => {
    running = false;
    if (abortController) abortController.abort();
    setStatus('停止しました。');
    els.startBtn.disabled = false;
    els.stopBtn.disabled = true;
  });

  els.resetBtn.addEventListener('click', () => {
    running = false;
    if (abortController) abortController.abort();
    conversation = [];
    resetGeminiState();
    els.chat.innerHTML = '';
    els.chat.appendChild(els.emptyHint);
    els.emptyHint.style.display = 'block';
    els.userMessage.value = '';
    setStatus('');
    els.startBtn.disabled = false;
    els.stopBtn.disabled = true;
  });

  els.copyBtn.addEventListener('click', async () => {
    if (conversation.length === 0) { setStatus('コピーする会話がありません。'); return; }
    const text = conversation.map(m => `${getDisplayName(m.side)}: ${m.text}`).join('\n\n');
    try {
      await navigator.clipboard.writeText(text);
      setStatus('会話をクリップボードにコピーしました。', 'ok');
    } catch (e) {
      setStatus('コピーに失敗しました: ' + e.message, 'error');
    }
  });

  // Persist non-sensitive fields as the user edits them.
  ['a', 'b'].forEach((side) => {
    ['name', 'provider', 'model', 'system', 'keySave', 'key'].forEach((field) => {
      els[side][field].addEventListener('change', saveSettings);
    });
  });
  [els.userName, els.topic, els.starter, els.maxTurns, els.delay, els.maxTokens].forEach((el) => {
    el.addEventListener('change', saveSettings);
  });
})();
</script>

</body>
</html>
